</style><style id="orientationPageStyle">@page{size:A4 landscape;margin:9mm}</style></head><body><main class="app"><header class="no-print"><h1>📅 Generador de Calendarios</h1></header><nav class="tabs no-print" id="tabs"><button data-mode="week">Semanal</button><button data-mode="month" class="active">Mensual</button><button data-mode="semester">Semestral</button><button data-mode="year">Anual</button></nav><section class="toolbar no-print"><div class="field"><label>Año</label><input id="year" type="number" min="2000" max="2100" value="2026"></div><div class="field" id="monthField"><label>Mes</label><select id="month"></select></div><div class="field hidden" id="weekField"><label>Semana que contiene</label><input id="weekDate" type="date"></div><div class="field hidden" id="semesterField"><label>Semestre</label><select id="semester"><option value="0">Enero a junio</option><option value="6">Julio a diciembre</option></select></div><div class="field"><label>Hoja</label><select id="orientation"><option value="landscape">Horizontal</option><option value="portrait">Vertical</option></select></div><div class="field"><label>Feriados argentinos</label><select id="showHolidays"><option value="yes">Mostrar</option><option value="no">Ocultar</option></select></div><button id="print">🖨️ Imprimir / Guardar PDF</button></section><section class="panel no-print" id="designSettings"><div class="row" style="align-items:center;justify-content:space-between"><strong>Personalización</strong><button type="button" class="secondary" id="themeToggle" aria-expanded="false">⚙️ Temas</button></div><div id="themeMenu" class="theme-menu hidden"></div><div id="titleSettings" class="row"><div class="field"><label>Título Superior</label><input id="customTitle" placeholder="Ej.: Planificación de Sistemas" maxlength="100"></div></div><div class="row" id="fontSettings"><div class="field" style="max-width:330px"><label for="titleSize">Tamaño del título: <output id="titleSizeValue">28</output> px</label><input id="titleSize" type="range" min="18" max="48" step="2" value="28"></div></div><div id="weekShiftSettings" class="row hidden"><label style="display:flex;align-items:center;gap:9px;cursor:pointer"><input type="checkbox" id="weekShifts" style="width:18px;height:18px;min-width:18px;accent-color:var(--accent)"> Dividir la semana en Mañana y Tarde</label></div><div id="notesSettings" class="row"><div class="field"><label>Renglones para anotaciones</label><select id="notesEnabled"><option value="yes">Mostrar</option><option value="no">Ocultar</option></select></div><div class="field"><label>Imagen inferior (opcional)</label><input type="file" accept="image/*" id="bottomImage"></div><button class="secondary" id="clearBottomImage" type="button">Quitar imagen</button></div><div id="annualImages" class="row hidden"><div class="field"><label>Imagen a la izquierda del título (opcional)</label><input type="file" accept="image/*" id="leftImage"></div><div class="field"><label>Imagen a la derecha del título (opcional)</label><input type="file" accept="image/*" id="rightImage"></div><button class="secondary" id="clearAnnualImages" type="button">Quitar imágenes</button></div></section><div class="status no-print" id="status">Cargando feriados…</div><section id="output"></section></main><script>
'use strict';
const months=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const weekdays=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const $=id=>document.getElementById(id), pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const date=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)};
const plus=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n,12);
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let mode='month', holidays=new Map(),fetchToken=0;
let bottomImage='',leftImage='',rightImage='';
const themes=[['Clásico','#167d89','#e8f2f4','#fff1e5','#ffffff'],['Océano','#2875ac','#d7eafa','#fce0ba','#f6fbff'],['Lavanda','#8260aa','#e9ddf6','#f6d8dc','#fcf9ff'],['Pastel','#bc786d','#f9e2dc','#f7ddb5','#fffaf7'],['Naturaleza','#568657','#dcedd7','#f5d6a7','#f9fcf6'],['Elegante','#343b46','#e5e7eb','#f3cfb8','#ffffff'],['Minimalista','#606a74','#f3f4f6','#ece0d2','#ffffff']];
let themeIndex=Number(localStorage.getItem('calendariosTema')||0);if(!themes[themeIndex])themeIndex=0;
function applyTheme(){const t=themes[themeIndex];['--accent','--head','--holiday'].forEach((key,i)=>document.documentElement.style.setProperty(key,t[i+1]));document.documentElement.style.setProperty('--paper','#ffffff');document.querySelectorAll('[data-theme]').forEach(b=>b.classList.toggle('chosen',Number(b.dataset.theme)===themeIndex));}
$('themeMenu').innerHTML=themes.map((t,i)=>`<button type="button" class="theme-option" data-theme="${i}"><span class="swatches">${t.slice(1).map(c=>`<i style="background:${c}"></i>`).join('')}</span>${t[0]}</button>`).join('');
$('themeToggle').onclick=()=>{const opened=$('themeMenu').classList.toggle('hidden');$('themeToggle').setAttribute('aria-expanded',String(!opened))};
$('themeMenu').onclick=e=>{const b=e.target.closest('[data-theme]');if(!b)return;themeIndex=Number(b.dataset.theme);localStorage.setItem('calendariosTema',String(themeIndex));applyTheme();$('themeMenu').classList.add('hidden');$('themeToggle').setAttribute('aria-expanded','false')};applyTheme();
async function readImage(input,cb){const file=input.files?.[0];if(!file)return;if(!file.type.startsWith('image/')||file.size>5*1024*1024){alert('Elegí una imagen de hasta 5 MB.');input.value='';return}const reader=new FileReader();reader.onload=()=>{cb(String(reader.result));render()};reader.readAsDataURL(file)}
[['bottomImage',v=>bottomImage=v],['leftImage',v=>leftImage=v],['rightImage',v=>rightImage=v]].forEach(([id,cb])=>$(id).addEventListener('change',()=>readImage($(id),cb)));
$('clearBottomImage').onclick=()=>{bottomImage='';$('bottomImage').value='';render()};$('clearAnnualImages').onclick=()=>{leftImage=rightImage='';$('leftImage').value=$('rightImage').value='';render()};
$('titleSize').addEventListener('input',()=>{$('titleSizeValue').textContent=$('titleSize').value;render()});$('customTitle').addEventListener('input',render);$('notesEnabled').addEventListener('change',render);
$('month').innerHTML=months.map((m,i)=>`<option value="${i}">${m}</option>`).join('');
const today=new Date();$('year').value=today.getFullYear();$('month').value=today.getMonth();$('weekDate').value=iso(today);
function yearsNeeded(){const y=Number($('year').value), m=Number($('month').value);if(mode==='week'){const d=date($('weekDate').value||iso(today));const start=plus(d,-((d.getDay()+6)%7));return [...new Set([start.getFullYear(),plus(start,6).getFullYear()])]}return [y]}
// MISMA fuente que usa el módulo de feriados del Escritorio: api.argentinadatos.com/v1/feriados/{anio}
const holidayCache=new Map();
async function getHolidays(y){if(holidayCache.has(y))return holidayCache.get(y);const response=await fetch(`https://api.argentinadatos.com/v1/feriados/${y}`);if(!response.ok)throw Error('HTTP '+response.status);const data=await response.json();const map=new Map(data.filter(x=>/^\d{4}-\d{2}-\d{2}$/.test(x.fecha)).map(x=>[x.fecha,x]));holidayCache.set(y,map);return map}
async function refreshHolidays(){const token=++fetchToken;const yrs=yearsNeeded();$('status').textContent='';try{const maps=await Promise.all(yrs.map(getHolidays));if(token!==fetchToken)return;holidays=new Map(maps.flatMap(m=>[...m]));$('status').textContent=''}catch(e){if(token!==fetchToken)return;holidays=new Map();$('status').textContent='⚠️ No se pudieron consultar los feriados. Se puede imprimir, pero sin marcas de feriados. Revisá la conexión.'}render()}
function holiday(d){return $('showHolidays').value==='yes'?holidays.get(iso(d)):null}
function dayCell(d,month,small=false){if(!d||d.getMonth()!==month)return '<td class="empty"></td>';const h=holiday(d);return `<td class="${h?'holiday':''}" title="${h?escapeHtml(h.nombre):''}"><div class="day">${d.getDate()}</div>${h&&!small?`<div class="holname">${escapeHtml(h.nombre)}</div>`:''}</td>`}
function calendarMonth(y,m,small=false){const first=new Date(y,m,1,12), offset=(first.getDay()+6)%7, count=new Date(y,m+1,0).getDate();const rows=Math.ceil((offset+count)/7);let html=`<table class="cal ${small?'mini':'month'}"><thead><tr>${weekdays.map(w=>`<th>${small?w.slice(0,1):w}</th>`).join('')}</tr></thead><tbody>`;for(let r=0;r<rows;r++){html+='<tr>';for(let c=0;c<7;c++){const n=r*7+c-offset+1;html+=dayCell(n>0&&n<=count?new Date(y,m,n,12):null,m,small)}html+='</tr>'}return html+'</tbody></table>'}
function sheet(title,body,subtitle='',headerHtml=''){return `<article class="sheet">${headerHtml||`<h2>${escapeHtml(title)}</h2>`}${subtitle?`<p class="subheading">${escapeHtml(subtitle)}</p>`:''}${body}</article>`}
function upperMonth(d){return months[d.getMonth()].toLocaleUpperCase('es-AR')}
function longDate(d){return `${d.getDate()} de ${upperMonth(d)}`}
function notesFooter(){if($('notesEnabled').value!=='yes'&&!bottomImage)return '';const lines=$('notesEnabled').value==='yes'?'<div class="note-lines">'+Array.from({length:5},()=>'<div></div>').join('')+'</div>':'';const pic=bottomImage?`<div class="footer-image"><img src="${bottomImage}" alt="Imagen personalizada"></div>`:'';return `<div class="sheet-footer">${lines}${pic}</div>`}
function customHeading(){const v=$('customTitle').value.trim();return v?`<div class="custom-heading">${escapeHtml(v)}</div>`:''}
function renderWeek(){
 const d=date($('weekDate').value||iso(today)),start=plus(d,-((d.getDay()+6)%7));
 const days=Array.from({length:7},(_,i)=>plus(start,i)),end=days[6];
 const shifts=$('weekShifts').checked;
 const th=days.map(x=>`<th>${weekdays[(x.getDay()+6)%7]} ${x.getDate()}</th>`).join('');
 const cells=days.map(x=>{const h=holiday(x);return `<td class="${h?'holiday':''}">${h?`<div class="holname">🇦🇷 ${escapeHtml(h.nombre)}</div>`:''}</td>`}).join('');
 const heading=start.getMonth()===end.getMonth()&&start.getFullYear()===end.getFullYear()?`Semana del ${start.getDate()} al ${end.getDate()} de ${upperMonth(start)} de ${end.getFullYear()}`:`Semana del ${longDate(start)}${start.getFullYear()!==end.getFullYear()?' de '+start.getFullYear():''} al ${longDate(end)} de ${end.getFullYear()}`;
 // La división es opcional y se imprime junto con etiquetas discretas.
 const table=shifts
   ? `<table class="cal week week-shifts"><colgroup><col class="shift-label-col"><col span="7"></colgroup><thead><tr><th class="shift-corner"></th>${th}</tr></thead><tbody><tr><th scope="row" class="shift-label">Mañana</th>${cells}</tr><tr><th scope="row" class="shift-label">Tarde</th>${days.map(()=>'<td></td>').join('')}</tr></tbody></table>`
   : `<table class="cal week"><thead><tr>${th}</tr></thead><tbody><tr>${cells}</tr></tbody></table>`;
 return sheet(heading,`${customHeading()}${table}${notesFooter()}`);
}
function renderMonth(){const y=Number($('year').value),m=Number($('month').value);return sheet(`${months[m]} ${y}`,`${customHeading()}${calendarMonth(y,m)}${notesFooter()}`)}
function monthHolidayList(y,m){if($('showHolidays').value!=='yes')return '';const items=[...holidays.entries()].filter(([key])=>key.startsWith(`${y}-${pad(m+1)}-`)).sort(([a],[b])=>a.localeCompare(b));return items.length?`<div class="holiday-list">${items.map(([key,h])=>`<div><b>${Number(key.slice(8))}</b> — ${escapeHtml(h.nombre||'Feriado')}</div>`).join('')}</div>`:''}
function renderMulti(semester){const y=Number($('year').value),start=semester?Number($('semester').value):0,range=semester?6:12;const cards=Array.from({length:range},(_,i)=>{const m=start+i;return `<section class="mini"><h3>${months[m]}</h3>${calendarMonth(y,m,true)}${semester?monthHolidayList(y,m):''}</section>`}).join('');const heading=semester?`${start===0?'1°':'2°'} Semestre ${y}`:`Calendario ${y}`;const header=semester?'':`<div class="annual-heading">${leftImage?`<img src="${leftImage}" alt="Decoración izquierda">`:'<span></span>'}<h2>${escapeHtml(heading)}</h2>${rightImage?`<img src="${rightImage}" alt="Decoración derecha">`:'<span></span>'}</div>`;return sheet(heading,`<div class="miniwrap ${semester?'sem':''}">${cards}</div>`,'',header).replace('class="sheet"',`class="sheet${semester?' semester-sheet':' annual-sheet'}"`)}
function render(){
 document.documentElement.style.setProperty('--title-size',$('titleSize').value+'px');
 $('monthField').classList.toggle('hidden',mode!=='month');
 $('weekField').classList.toggle('hidden',mode!=='week');
 $('weekShiftSettings').classList.toggle('hidden',mode!=='week');
 $('semesterField').classList.toggle('hidden',mode!=='semester');
 $('titleSettings').classList.toggle('hidden',!['week','month'].includes(mode));
 $('notesSettings').classList.toggle('hidden',!['week','month'].includes(mode));
 $('annualImages').classList.toggle('hidden',mode!=='year');
 $('output').innerHTML=mode==='week'?renderWeek():mode==='month'?renderMonth():mode==='semester'?renderMulti(true):renderMulti(false);
}
$('tabs').addEventListener('click',e=>{const btn=e.target.closest('[data-mode]');if(!btn)return;mode=btn.dataset.mode;document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('active',x===btn));render();refreshHolidays()});
$('year').addEventListener('change',()=>{render();refreshHolidays()});$('weekDate').addEventListener('change',()=>{render();refreshHolidays()});['month','semester','showHolidays'].forEach(id=>$(id).addEventListener('change',render));
$('weekShifts').addEventListener('change',render);
$('orientation').addEventListener('change',()=>{document.body.classList.toggle('portrait',$('orientation').value==='portrait');$('orientationPageStyle').textContent=`@page{size:A4 ${$('orientation').value};margin:9mm}`});
$('print').addEventListener('click',()=>window.print());
refreshHolidays();
</script>
<script id="calendar-embed-theme">
(function(){
 const apply=(d)=>{if(!d||d.type!=='CALENDARIOS_THEME')return;
 document.documentElement.setAttribute('data-embed-theme',d.theme==='dark'?'dark':'light');
 document.documentElement.setAttribute('data-embed-color',d.color==='sigri'?'sigri':'violeta');};
 window.addEventListener('message',e=>{if(e.origin!==location.origin)return;apply(e.data)});
 try{if(window.parent!==window){apply({type:'CALENDARIOS_THEME',theme:parent.document.documentElement.getAttribute('data-theme'),color:parent.document.documentElement.getAttribute('data-color-theme')})}}catch(e){}
})();
</script>
</body></html>
