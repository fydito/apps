(()=>{'use strict';
const $=id=>document.getElementById(id),synth=window.speechSynthesis;
const recording={stream:null,recorder:null,parts:[],url:null,mp3url:null,active:false,starting:false,auto:false,finishing:false,startTimer:null,elapsedTimer:null,startedAt:0,elapsedMs:0,outputName:"VoicerCreator"};
const state={fileType:null,mode:'texto',pdf:null,voices:[],chunks:[],position:0,playing:false,paused:false,token:0};
function status(message){$('estado').textContent=message;}
function stop(){state.token++;state.playing=false;state.paused=false;state.chunks=[];state.position=0;if(synth)synth.cancel();updateControls();}
function updateControls(){const b=$('speak-btn');b.textContent=state.paused?'▶ Continuar':state.playing?'⏸ Pausar':'▶ Reproducir';$('stop-btn').disabled=!state.playing&&!state.paused;}
function mode(next){stop();state.mode=next;for(const name of ['texto','pdf']){$('panel-'+name).hidden=name!==next;$('tab-'+name).classList.toggle('active',name===next);}status(next==='pdf'?'Seleccioná un documento para empezar.':'Ingresá un texto para empezar.');}
$('tab-texto').onclick=()=>mode('texto');$('tab-pdf').onclick=()=>mode('pdf');
function voices(){const previous=state.voices[Number($('voice-select').value)];// Países de América (incluido el Caribe) y España, según la región BCP-47 de cada voz.
const allowedRegions=new Set('US CA MX GT BZ SV HN NI CR PA CU DO HT JM BS BB AG DM GD KN LC VC TT PR VI AI AW BM BQ CW KY MS TC SX GP MQ BL MF PM GL CO VE GY SR GF EC PE BO BR PY UY AR CL FK ES'.split(' '));

$('speak-btn').onclick=()=>{

 if(state.playing){state.paused=true;state.playing=false;synth.pause();updateControls();status(`En pausa · fragmento ${state.position+1} de ${state.chunks.length}.`);return;}
 beginReading();
};
$('stop-btn').onclick=()=>{stop();status('Lectura detenida. Al reproducir comenzará desde el principio.');if(recording.active&&recording.auto)finishRecording();};
function formatElapsed(ms){const seconds=Math.floor(ms/1000);return String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');}
function startElapsed(){

 $('record-timer-value').textContent='00:00';
 recording.elapsedTimer=setInterval(()=>{$('record-timer-value').textContent=formatElapsed(performance.now()-recording.startedAt);},250);
}
function stopElapsed(){
 if(recording.elapsedTimer){clearInterval(recording.elapsedTimer);recording.elapsedTimer=null;}
 if(recording.startedAt){recording.elapsedMs=performance.now()-recording.startedAt;recording.startedAt=0;}
 $('record-timer-value').textContent=formatElapsed(recording.elapsedMs);
 $('record-timer').classList.remove('is-recording');$('tape-anim').hidden=true;
}
function outputBasename(){
 const file=state.mode==='pdf' ? $('pdf-file').files?.[0] : null;
 const original=file?.name?.replace(/\.[^.]+$/,'')||'VoicerCreator';
 return original.replace(/[\\/:*?"<>|\x00-\x1f]/g,'_').trim().replace(/[. ]+$/,'').slice(0,150)||'VoicerCreator';
}
function recordingStatus(message){$('record-status').textContent=message;}
function captureControls(){
 $('record-btn').disabled=recording.active||recording.starting;
 $('record-stop-btn').disabled=!recording.active;
 $('record-btn').classList.toggle('recording',recording.active);
 for(const id of ['tab-texto','tab-pdf','voice-select','pdf-file','extract-btn','pdf-pages','text-input','pdf-text']){
  const el=$(id);if(!el)continue;
  if(recording.active||recording.starting){if(!el.dataset.preRecordDisabled)el.dataset.preRecordDisabled=el.disabled?'yes':'no';el.disabled=true;}
  else if(el.dataset.preRecordDisabled){el.disabled=el.dataset.preRecordDisabled==='yes';delete el.dataset.preRecordDisabled;}
 }
}
function cleanupCapture(){
 stopElapsed();
 if(recording.startTimer){clearTimeout(recording.startTimer);recording.startTimer=null;}
 if(recording.stream){recording.stream.getTracks().forEach(t=>t.stop());recording.stream=null;}
 recording.active=false;recording.starting=false;recording.auto=false;recording.finishing=false;
 captureControls();
}
function finishRecording(){
 if(recording.finishing)return;
 stopElapsed();
 recording.finishing=true;
 if(recording.startTimer){clearTimeout(recording.startTimer);recording.startTimer=null;}
 if(recording.recorder&&recording.recorder.state!=='inactive'){
  recordingStatus('Finalizando archivo de audio…');recording.recorder.stop();
 }else cleanupCapture();
}
function resetPreviousRecording(){
 $('record-preview').hidden=true;$('record-preview').removeAttribute('src');$('record-preview').load();
 $('record-download').hidden=true;
 $('record-timer').hidden=true;$('tape-anim').hidden=true;$('record-timer-value').textContent='00:00';recording.elapsedMs=0;recording.startedAt=0;
 if(recording.url){URL.revokeObjectURL(recording.url);recording.url=null;}
 if(recording.mp3url){URL.revokeObjectURL(recording.mp3url);recording.mp3url=null;}
}

function id3TextFrame(id,value){
 const str=String(value),chars=new Uint8Array(2+str.length*2+2);
 chars[0]=1;chars[1]=0xff;chars[2]=0xfe;
 for(let i=0;i<str.length;i++){const c=str.charCodeAt(i);chars[3+i*2]=c&255;chars[4+i*2]=c>>>8;}
 return id3Frame(id,chars);
}
function id3Frame(id,payload){
 const h=new Uint8Array(10);for(let i=0;i<4;i++)h[i]=id.charCodeAt(i);
 const n=payload.length;h[4]=(n>>>24)&255;h[5]=(n>>>16)&255;h[6]=(n>>>8)&255;h[7]=n&255;
 const result=new Uint8Array(10+n);result.set(h);result.set(payload,10);return result;
}
function coverBytes(){const raw=atob(COVER_JPEG_BASE64),out=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)out[i]=raw.charCodeAt(i);return out;}
function id3CoverFrame(){
 const mime=new TextEncoder().encode('image/jpeg');const cover=coverBytes();
 const data=new Uint8Array(1+mime.length+1+1+1+cover.length);
 let p=0;data[p++]=0;data.set(mime,p);p+=mime.length;data[p++]=0;data[p++]=3;data[p++]=0;data.set(cover,p);
 return id3Frame('APIC',data);

   }
   const data=encoder.encodeBuffer(pcm);
   if(data.length)blocks.push(new Uint8Array(data));
   if((offset/chunkSize)%16===0){
    recordingStatus('Convirtiendo a MP3… '+Math.round(end/samples.length*100)+' %');
    await new Promise(resolve=>setTimeout(resolve,0));
   }
  }
  const tail=encoder.flush();if(tail.length)blocks.push(new Uint8Array(tail));
  return new Blob(blocks,{type:'audio/mpeg'});
 }finally{await context.close();}
}
async function startRecordingCapture(){
 if(recording.active||recording.starting)return;
 const text=$(state.mode==='texto'?'text-input':'pdf-text').value.trim();
 if(!text){recordingStatus('Primero prepará un texto o cargá un documento.');return;}
 if(!state.voices.length){recordingStatus('Esperá a que carguen las voces disponibles.');return;}
 if(!navigator.mediaDevices?.getDisplayMedia||!window.MediaRecorder){recordingStatus('Este navegador no permite capturar audio. Probá Edge actualizado.');return;}
 stop();recording.starting=true;captureControls();resetPreviousRecording();recording.outputName=outputBasename();
 recordingStatus('Esperando autorización de Edge… Elegí Pantalla completa y compartí audio del sistema.');
 try{
  const stream=await navigator.mediaDevices.getDisplayMedia({video:true,audio:{systemAudio:'include'},systemAudio:'include',selfBrowserSurface:'include'});
  recording.stream=stream;
  if(!stream.getAudioTracks().length){cleanupCapture();recordingStatus('No se compartió audio. Reintentá y activá el audio del sistema.');return;}
  const audioStream=new MediaStream(stream.getAudioTracks());
  const audioMime=['audio/webm;codecs=opus','audio/webm'].find(t=>MediaRecorder.isTypeSupported(t))||'';
  const rec=new MediaRecorder(audioStream,audioMime?{mimeType:audioMime}:undefined);
  recording.recorder=rec;recording.parts=[];recording.finishing=false;recording.active=true;recording.starting=false;recording.auto=true;
  rec.ondataavailable=e=>{if(e.data.size)recording.parts.push(e.data);};
  rec.onerror=e=>{recordingStatus('Error de grabación: '+(e.error?.message||'desconocido'));stop();finishRecording();};
  rec.onstop=async()=>{
   const blob=new Blob(recording.parts,{type:rec.mimeType||'audio/webm'});
   cleanupCapture();recording.recorder=null;
   if(!blob.size){recordingStatus('No se recibieron datos de audio. Revisá el permiso de Edge.');return;}
   recording.url=URL.createObjectURL(blob);
   const a=$('record-download');
   const preview=$('record-preview');preview.src=recording.url;preview.hidden=false;
   a.hidden=true;
   recordingStatus('Grabación terminada. Convirtiendo a MP3…');
   try{
    const mp3=await convertToMp3(blob);
    recording.mp3url=URL.createObjectURL(withMp3Metadata(mp3,recording.outputName));
    a.href=recording.mp3url;
    a.download=recording.outputName+'.mp3';
    a.textContent='⬇ Descargar MP3';a.hidden=false;
    preview.src=recording.mp3url;
    recordingStatus('MP3 listo. Podés escucharlo y descargarlo.');
   }catch(error){
    a.href=recording.url;
    a.download=recording.outputName+'.webm';
    a.textContent='⬇ Descargar WebM (respaldo)';a.hidden=false;
    recordingStatus('No se pudo convertir a MP3: '+error.message+' Se conserva la grabación WebM.');
   }
  };
  stream.getVideoTracks().forEach(t=>t.addEventListener('ended',()=>{stop();finishRecording();},{once:true}));
  stream.getAudioTracks().forEach(t=>t.addEventListener('ended',()=>{stop();finishRecording();},{once:true}));
  rec.start(250);startElapsed();captureControls();
  recordingStatus('Grabando… La lectura comenzará automáticamente.');
  recording.startTimer=setTimeout(()=>{recording.startTimer=null;if(recording.active&&!recording.finishing&&!beginReading())finishRecording();},450);
 }catch(e){cleanupCapture();recordingStatus(e.name==='NotAllowedError'?'Captura cancelada o permiso denegado.':'No se pudo iniciar la captura: '+e.message);}
}
const guide=$('capture-guide');
$('record-btn').onclick=()=>{
 if(recording.active||recording.starting)return;
 const value=$(state.mode==='texto'?'text-input':'pdf-text').value.trim();
 if(!value){recordingStatus('Primero prepará un texto o cargá un documento.');return;}
 if(!state.voices.length){recordingStatus('Esperá a que carguen las voces disponibles.');return;}
 if(!navigator.mediaDevices?.getDisplayMedia||!window.MediaRecorder){recordingStatus('Este navegador no permite capturar audio. Probá Edge actualizado.');return;}
 guide.showModal();
};
$('capture-guide-cancel').onclick=()=>guide.close();
$('capture-guide-go').onclick=()=>{guide.close();startRecordingCapture();};
$('record-stop-btn').onclick=()=>{stop();finishRecording();};
window.addEventListener('pagehide',()=>{stop();cleanupCapture();if(recording.url)URL.revokeObjectURL(recording.url);if(recording.mp3url)URL.revokeObjectURL(recording.mp3url);});updateControls();
function parsePages(raw,total){if(!raw.trim())return Array.from({length:total},(_,i)=>i+1);const pages=new Set();for(const part of raw.split(',')){const m=part.trim().match(/^(\d+)(?:\s*-\s*(\d+))?$/);if(!m)throw Error('Formato de páginas incorrecto. Ejemplo: 1-3, 5');const a=Number(m[1]),b=m[2]?Number(m[2]):a;if(a<1||b>total||a>b)throw Error(`Las páginas deben estar entre 1 y ${total}.`);for(let n=a;n<=b;n++)pages.add(n);}return [...pages].sort((a,b)=>a-b);}
async function extract(){if(!state.pdf)return;stop();const btn=$('extract-btn');btn.disabled=true;try{const pages=parsePages($('pdf-pages').value,state.pdf.numPages);const parts=[];for(let i=0;i<pages.length;i++){status(`Extrayendo página ${pages[i]} (${i+1}/${pages.length})...`);const page=await state.pdf.getPage(pages[i]);const content=await page.getTextContent();let out='',lastY=null;for(const item of content.items){if(typeof item.str!=='string')continue;const y=item.transform?.[5];if(lastY!==null&&typeof y==='number'&&Math.abs(y-lastY)>4)out+='\n';else if(out&&!out.endsWith('\n')&&!out.endsWith(' ')&&item.str&&!item.str.startsWith(' '))out+=' ';out+=item.str;if(item.hasEOL)out+='\n';if(typeof y==='number')lastY=y;}parts.push(out.trim());}$('pdf-text').value=parts.filter(Boolean).join('\n\n');status($('pdf-text').value?`Texto extraído de ${pages.length} página(s). Listo para escuchar.`:'No se encontró texto seleccionable. Es posible que sea un PDF escaneado.');}catch(e){status('No se pudo extraer el texto: '+e.message);}finally{btn.disabled=false;}}
$('extract-btn').onclick=extract;
// Los DOC clásicos son binarios OLE: extracción local aproximada, sin prometer fidelidad.
function extractLegacyDoc(buffer){
 const bytes=new Uint8Array(buffer), latin=[];let cur='';
 for(let i=0;i<bytes.length;i++){const c=bytes[i];if((c>=32&&c<=126)||c>=160){cur+=String.fromCharCode(c);}else{if(cur.length>=24)latin.push(cur);cur='';}}
 if(cur.length>=24)latin.push(cur);
 const wide=[];cur='';for(let i=0;i<bytes.length-1;i+=2){const c=bytes[i]|(bytes[i+1]<<8);if((c>=32&&c<=126)||(c>=160&&c<=255)||c===10||c===13){cur+=String.fromCharCode(c);}else{if(cur.length>=24)wide.push(cur);cur='';}}
 if(cur.length>=24)wide.push(cur);
 const candidate=(wide.join('\n').length>latin.join('\n').length?wide:latin).filter(x=>/[a-záéíóúñü]{3,}/i.test(x));
 return candidate.join('\n').replace(/[ \t]{3,}/g,' ').trim();
}
$('pdf-file').onchange=async e=>{
 stop();state.pdf=null;state.fileType=null;$('pdf-text').value='';$('extract-btn').disabled=true;
 const file=e.target.files[0];if(!file)return;
 const ext=file.name.split('.').pop().toLowerCase();state.fileType=ext;
 const pdfControls=$('pdf-pages').closest('.pdf-options');pdfControls.hidden=ext!=='pdf';
 $('pdf-info').textContent=file.name;
 try{
  status('Leyendo documento…');
  if(ext==='pdf'){
   if(!window.pdfjsLib)throw Error('No se cargó el lector PDF.');
   pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
   state.pdf=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
   $('pdf-info').textContent=`${file.name} · ${state.pdf.numPages} página(s)`;
   $('extract-btn').disabled=false;await extract();return;
  }
  if(ext==='txt'){
   const bytes=new Uint8Array(await file.arrayBuffer());
   let encoding='utf-8';if(bytes[0]===0xff&&bytes[1]===0xfe)encoding='utf-16le';
   let content=new TextDecoder(encoding).decode(bytes);
   if(content.includes('\uFFFD'))content=new TextDecoder('windows-1252').decode(bytes);
   $('pdf-text').value=content.replace(/^\uFEFF/,'');
  }else if(ext==='docx'){
   if(!window.mammoth)throw Error('No se cargó el lector DOCX. Comprobá la conexión.');
   const result=await mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()});
   $('pdf-text').value=result.value;
  }else if(ext==='doc'){
   $('pdf-text').value=extractLegacyDoc(await file.arrayBuffer());
   if(!$('pdf-text').value)throw Error('Este DOC antiguo no se pudo interpretar. Guardalo como DOCX desde Word e intentá de nuevo.');
   status('DOC antiguo: extracción aproximada. Revisá el texto antes de narrar.');return;
  }else throw Error('Formato no compatible.');
  status($('pdf-text').value.trim()?'Documento listo para escuchar.':'El documento no contiene texto legible.');
 }catch(err){$('pdf-info').textContent='No se pudo leer el documento.';status('Error: '+err.message);}
};
})();
