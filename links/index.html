<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0c776d"><title>Links de Fydito</title><link rel="icon" type="image/png" href="./fydito.png"><style>
:root{color-scheme:light;--bg:#f3faf6;--card:#fff;--fg:#15382f;--muted:#607a70;--accent:#008e7b;--border:#cde4d9;--shadow:0 16px 40px #163e2a13}body.dark{color-scheme:dark;--bg:#0c1b2b;--card:#15293b;--fg:#edf9fa;--muted:#a7c2c9;--accent:#50dacb;--border:#365268;--shadow:0 16px 40px #0004}*{box-sizing:border-box}body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--fg);margin:0;min-height:100vh}main{width:min(720px,calc(100% - 32px));margin:0 auto;padding:28px 0 60px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:35px}a{color:var(--accent)}.back{text-decoration:none;font-weight:700}button{cursor:pointer;font:inherit}.theme{background:var(--card);border:1px solid var(--border);border-radius:12px;color:var(--fg);padding:9px 14px}section{background:var(--card);border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow);padding:clamp(22px,5vw,40px)}.logo{display:flex;align-items:center;gap:18px;margin-bottom:18px}.logo img{width:76px;height:76px;object-fit:contain;background:white;border-radius:18px;padding:6px}h1{font-size:clamp(27px,5vw,38px);margin:0}p{color:var(--muted);line-height:1.5}.hint{font-size:14px;margin:7px 0 24px}label{display:block;font-weight:700;margin:0 0 10px}input{display:block;width:100%;font:inherit;padding:15px 14px;border-radius:13px;border:1px solid var(--border);background:var(--bg);color:var(--fg)}.primary{margin-top:16px;width:100%;padding:14px;border:0;border-radius:13px;background:var(--accent);color:#062d2b;font-weight:800}.primary:disabled{opacity:.6;cursor:wait}.result{margin-top:22px;padding:20px;border:1px solid var(--border);border-radius:15px;background:var(--bg)}.result a{font-size:18px;font-weight:700;overflow-wrap:anywhere}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}.actions button{border:1px solid var(--border);background:var(--card);color:var(--fg);border-radius:10px;padding:10px 15px}.msg{margin-top:14px;min-height:22px;font-size:14px}.msg.error{color:#d55454}.small{font-size:13px;text-align:center;margin-top:20px} [hidden]{display:none!important}</style></head><body><main><header><a class="back" href="../">← Apps de Fydito</a><button class="theme" id="theme" aria-label="Cambiar tema">☾ Modo oscuro</button></header><section><div class="logo"><img src="./fydito.png" alt="Fydito"><div><h1>Links de Fydito</h1><p style="margin:5px 0 0">Tus enlaces, más cortitos.</p></div></div><p class="hint">Pegá una dirección larga y obtené un enlace corto para compartir. Los enlaces se generan en nuestro servicio de sigri.com.ar.</p><form id="form"><label for="url">Enlace original</label><input type="url" id="url" placeholder="https://ejemplo.com/una-direccion-muy-larga" required maxlength="8000" autocomplete="url" inputmode="url"><button id="submit" class="primary" type="submit">Acortar enlace 🔗</button></form><div id="message" class="msg" role="status" aria-live="polite"></div><div id="result" class="result" hidden><strong>¡Listo! Tu enlace corto:</strong><p><a id="short" target="_blank" rel="noopener noreferrer"></a></p><div class="actions"><button type="button" id="copy">📋 Copiar enlace</button><button type="button" id="share">↗ Compartir</button></div></div></section><p class="small">Creado con ☕ por Fydito · No ingreses contraseñas ni datos privados en la URL.</p></main><script>
const $=id=>document.getElementById(id);const theme=$('theme');function setTheme(dark){document.body.classList.toggle('dark',dark);theme.textContent=dark?'☀ Modo claro':'☾ Modo oscuro';try{localStorage.setItem('fydito_theme',dark?'dark':'light')}catch{}}try{setTheme(localStorage.getItem('fydito_theme')==='dark')}catch{}theme.addEventListener('click',()=>setTheme(!document.body.classList.contains('dark')));let current='';const message=$('message');function say(s,error=false){message.textContent=s;message.classList.toggle('error',error)}$('form').addEventListener('submit',async e=>{e.preventDefault();const url=$('url').value.trim();try{const u=new URL(url);if(!['http:','https:'].includes(u.protocol))throw Error('Ingresá un enlace HTTP o HTTPS válido.')}catch(err){say(err.message||'Ingresá una URL válida.',true);return}const btn=$('submit');btn.disabled=true;btn.textContent='Acortando…';$('result').hidden=true;say('Conectando con el acortador…');try{const r=await fetch('https://sigri.com.ar/acortador/api.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});let data;try{data=await r.json()}catch{throw Error('El servidor no devolvió una respuesta válida.')}if(!r.ok||!data.ok||!data.short_url)throw Error(data.error||'No se pudo acortar el enlace.');current=data.short_url;$('short').href=current;$('short').textContent=current;$('result').hidden=false;say('¡Enlace creado!')}catch(err){say(err instanceof TypeError?'No se pudo conectar. Comprobá que el servidor permita solicitudes desde fydito.github.io (CORS).':err.message,true)}finally{btn.disabled=false;btn.textContent='Acortar enlace 🔗'}});$('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(current);say('¡Copiado al portapapeles!')}catch{say('Seleccioná el enlace para copiarlo.',true)}});$('share').addEventListener('click',async()=>{if(navigator.share){try{await navigator.share({url:current,title:'Link de Fydito'})}catch{}}else{try{await navigator.clipboard.writeText(current);say('Enlace copiado para compartir.')}catch{say('Seleccioná el enlace para compartirlo.',true)}}});
</script></body></html>
